[workspace]
resolver = "2"
members = [
    "crates/spider-core",
    "crates/spider-daemon",
    "crates/spider-py",
    "crates/spider-inspect",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sujal Nath"]
license = "MIT"
repository = "https://github.com/nathsujal/spider"
rust-version = "1.75"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
memmap2 = "0.9"
sha2 = "0.10"
anyhow = "1.0"

# Hashing
rustc-hash = "2.1"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Web server (daemon)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# CLI (inspect)
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
comfy-table = "7.1"
csv = "1.3"
atty = "0.2"

# Internal crates
spider-core = { path = "crates/spider-core" }
